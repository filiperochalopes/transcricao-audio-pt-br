[project]
name = "transcribe-whisper"
version = "0.1.0"
description = "Simple MLX Whisper transcription CLI for macOS."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx-whisper>=0.4.2",
    "typer>=0.12.5",
]

[project.scripts]
transcribe-whisper = "transcribe_whisper.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
